<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Look modelled on Google Ads Editor 2.13 (Qt, Material palette read from the app and a window capture). No Google logos or icons. */
:root{
  --bg:#fff;--panel:#fff;--side:#fff;--head:#f8f9fa;--line:#dadce0;--line2:#e8eaed;--text:#202124;--text2:#3c4043;--muted:#5f6368;
  --accent:#1a73e8;--accent-bg:#e8f0fe;--ok:#188038;--ok-bg:#ceead6;--warn:#b06000;--warn-bg:#feefc3;--bad:#d93025;--bad-bg:#fad2cf;
  --draft:#8430ce;--draft-bg:#e9d2fd;--info-bg:#d2e3fc;--hover:#f1f3f4;--sel:#ceead6;--sel-text:#202124;--title:#2d2e30;--title-text:#e8eaed;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#202124;--panel:#292a2d;--side:#202124;--head:#2d2e31;--line:#3c4043;--line2:#35363a;--text:#e8eaed;--text2:#bdc1c6;--muted:#9aa0a6;
  --accent:#8ab4f8;--accent-bg:#283a57;--ok:#81c995;--ok-bg:#1e3a2a;--warn:#fdd663;--warn-bg:#3d3420;--bad:#f28b82;--bad-bg:#4a2523;
  --draft:#d7aefb;--draft-bg:#3d2a52;--info-bg:#25344d;--hover:#35363a;--sel:#1e3a2a;--sel-text:#e8eaed;--title:#17181a;--title-text:#bdc1c6;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 14px;font-weight:500;color:var(--text2)}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){button.primary{color:#202124}}
button.primary:hover{filter:brightness(1.08)}
button.primary:disabled{opacity:.45;cursor:default}
button.danger{color:var(--bad)}
button.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{width:100%;resize:vertical}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;width:100vw;overflow:hidden}
html,body{overflow:hidden}
body.ov .app{grid-template-rows:auto 1fr auto}
body.area .app{grid-template-rows:auto 1fr auto}
.atabs{display:flex;gap:2px;margin-right:6px} .atabs button{border:0;background:none;padding:8px 12px;border-bottom:3px solid transparent;border-radius:0;color:var(--muted)}
.atabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.areapage{display:none;min-height:0;overflow:hidden}
body.area:not(.ov) .areapage{display:flex;flex-direction:column}
body.area main, body.area .subbar, body.area #sideOpen, body.area #acct, body.area #refreshBtn, body.area #pushHdr{display:none!important}
body.ov .atabs{visibility:hidden}
/* top bar: app name left, outlined action buttons right (Editor's toolbar) */
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0 6px 0 0;font-weight:400;color:var(--muted);letter-spacing:-.2px;white-space:nowrap}
header h1 b{color:var(--text2);font-weight:500}
.subbar select#acct{font-weight:500;flex:none;max-width:320px;padding:3px 6px;font-size:13px} /* the ad account picker sits first in the data bar */
header,.subbar{min-width:0;overflow:hidden}
@media (max-width:1560px){header{gap:6px;padding:8px 12px} header .tb{padding:7px 10px} header h1{font-size:19px} #hlAge{display:none} .atabs button{padding:8px 9px}}
@media (max-width:1380px){header h1{display:none}}
.tb{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text2);font-weight:500;white-space:nowrap}
.tb svg{width:17px;height:17px;fill:currentColor;flex:none}
.tb:hover{background:var(--hover)}
.pushhdr.has{background:var(--accent);border-color:var(--accent);color:#fff} .pushhdr.has:hover{filter:brightness(1.08)}
.pushn{display:none;min-width:18px;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.25);font-size:12px;text-align:center} .pushhdr.has .pushn{display:inline-block}
.pushok{font-size:16px;margin:4px 0 10px} .pushok b{color:var(--ok,#188038)}
.dlg-f .link{margin-right:auto}
.tally{border-collapse:collapse;width:100%;margin:2px 0 14px;font-size:14px} .tally td{padding:7px 4px;border-bottom:1px solid var(--line)} .tally td:last-child{text-align:right;font-weight:500;width:60px}
.pdet{margin-top:10px} .pdet summary{cursor:pointer;color:var(--accent);font-size:13px;margin-bottom:8px}
/* second bar: data state left, colour legend right (Editor's "Review account updates" bar) */
.subbar{display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--head);border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.legend{display:flex;gap:6px}
.legend span{padding:2px 8px;border-radius:2px;font-size:13px;color:var(--text)}
.lg-live{background:var(--ok-bg)}.lg-draft{background:var(--draft-bg)}.lg-bad{background:var(--bad-bg)}.lg-warn{background:var(--warn-bg)}
.chip{font-size:13px;padding:2px 8px;border-radius:2px;background:var(--line2);color:var(--text2);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--text)}
.chip.draft{background:var(--draft-bg);color:var(--text)}
.chip.ok{background:var(--ok-bg);color:var(--text)}
.chip.exp{font-size:12px;padding:1px 6px;margin-left:6px;background:var(--line2);color:var(--text2)}
.chip.exp.base{background:var(--warn-bg);color:var(--text)}
.spacer{flex:1}
main{display:grid;grid-template-columns:300px minmax(0,1fr) 400px;min-height:0;min-width:0}
aside,section{min-height:0;min-width:0;display:flex;flex-direction:column}
aside.tree{border-right:1px solid var(--line);background:var(--side)}
aside.draft{border-left:1px solid var(--line);background:var(--side)}
main.noside{grid-template-columns:300px 1fr 0}
.ovpage{display:none;overflow:auto;padding:20px 24px;background:var(--bg);min-height:0}
body.ov .ovpage{display:block} body.ov main, body.ov .subbar, body.ov #sideOpen{display:none!important}
body.ov #ovBtn{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.ov-top{display:flex;align-items:center;gap:12px;margin-bottom:16px} .ov-top h2{margin:0;font-size:20px;font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
.tile .k{font-size:12px;color:var(--muted)} .tile .v{font-size:24px;font-weight:400;margin-top:2px;font-variant-numeric:tabular-nums} .tile.hi{border-color:var(--accent);background:var(--accent-bg)}
.ov-ch{font-size:13px;font-weight:500;color:var(--text2);margin:16px 0 8px}
.ovpage h4{margin:22px 0 8px;font-weight:500}
.ovpage table{width:100%;border-collapse:collapse;background:var(--panel)} .ovpage th,.ovpage td{padding:6px 10px;border-bottom:1px solid var(--line2);text-align:left;font-size:13px} .ovpage td.num,.ovpage th.num{text-align:right}
main.noside aside.draft{display:none}
.rtabs .rclose{flex:0 0 40px;font-size:18px;line-height:1;color:var(--muted)}
#sideOpen{display:none;white-space:nowrap}
body.noside #sideOpen{display:inline-block}
.pad{padding:12px}
.search{position:relative}
.search input{width:100%;background:var(--head);border-color:transparent;padding-left:34px;height:38px}
.search svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:var(--muted)}
/* account tree: Editor's green "downloaded" band */
.tree-list{overflow:auto;flex:1 1 55%;padding:0 0 10px;border-bottom:1px solid var(--line)}
.node{display:flex;align-items:center;gap:7px;padding:0 10px;height:32px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-weight:500}
.node:hover{background:var(--hover)}
.node.sel{background:var(--sel);color:var(--sel-text)}
.node .tw{width:14px;color:var(--muted);flex:none;text-align:center;font-size:11px}
.node .nm{overflow:hidden;text-overflow:ellipsis}
.node.ag{padding-left:36px;font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.Paused{background:#9aa0a6}
.dot.Removed{background:var(--bad)}
/* MANAGE: entity types as a vertical list under the tree */
.manage-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;font-size:12px;font-weight:500;letter-spacing:.6px;color:var(--muted)}
.tabs{display:flex;flex-direction:column;overflow:auto;flex:1 1 45%;padding:0 0 10px}
.tab{flex:none;display:flex;justify-content:space-between;text-align:left;padding:0 16px 0 40px;height:34px;align-items:center;border:0;border-radius:0;background:none;white-space:nowrap;color:var(--text2);font-weight:400}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--line2);color:var(--text);font-weight:500}
.tab .n{font-size:13px;color:var(--muted);margin-left:6px;font-weight:400}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .crumb{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%;font-weight:500}
.grid-wrap{overflow:auto;flex:1}
/* data grid: Editor's flat table, grey sticky header, hairline rows */
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
th,td{padding:0 12px;height:34px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);text-align:left;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--head);z-index:1;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:1px solid var(--line);user-select:none;height:38px}
th.sorted{color:var(--accent)}
th.dragging{opacity:.4} th.drop-l{box-shadow:inset 3px 0 0 var(--accent)} th.drop-r{box-shadow:inset -3px 0 0 var(--accent)}
tr:hover td{background:var(--hover)}
tr.removed td{color:var(--muted);text-decoration:line-through}
tr.new td{background:var(--draft-bg)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.cb,th.cb{width:36px;text-align:center;padding:0 6px}
td.changed{background:var(--draft-bg)!important;color:var(--text);font-weight:500}
td.changed .old{color:var(--muted);text-decoration:line-through;font-weight:400;margin-right:6px}
td.edit{cursor:text}
td.edit:hover{outline:1px solid var(--accent);outline-offset:-2px}
td input,td select{padding:2px 6px;width:100%;min-width:70px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.st{font-size:13px}
.st.Paused{color:var(--muted)}
.st.Removed{color:var(--bad)}
.st.Enabled,.st.Active{color:var(--ok)}
.ed{font-size:12px;padding:1px 6px;border-radius:2px;background:var(--warn-bg);color:var(--text)}
.ed.draft{background:var(--draft-bg)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.draft-list{overflow:auto;flex:1;padding:0 12px 12px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.item .who{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.item .who b{color:var(--draft);font-weight:500}
.item .sum{margin:3px 0;word-break:break-word}
.item .note{font-size:12px;color:var(--muted);font-style:italic}
.item .prob{font-size:12px;color:var(--text);background:var(--bad-bg);border-radius:2px;padding:3px 7px;margin-top:4px}
.item .warnl,.pv .warnl,#editBody .warnl{font-size:12px;color:var(--text);background:var(--warn-bg);border-radius:2px;padding:3px 7px;margin-top:4px}
.draft-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--line)}
button.live{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:500}
@media (prefers-color-scheme: dark){button.live{color:#202124}}
button.live:disabled{opacity:.45;cursor:default}
.pv{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.pv .ln2{font-size:12px;color:var(--muted);font-family:"Roboto Mono",ui-monospace,Menlo,monospace;word-break:break-word}
.flag{font-size:12px;border-radius:2px;padding:2px 7px;margin-top:4px;display:inline-block;color:var(--text)}
.flag.spend{background:var(--warn-bg)}
.flag.perm{background:var(--bad-bg)}
.prog-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:500}
.prog-h .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.prog-h .done{color:var(--ok)} .prog-h .bad{color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-row{display:grid;grid-template-columns:1fr 150px 74px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.prog-row .bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;position:relative}
.prog-row .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.prog-row.done .bar i{background:var(--ok)} .prog-row.failed .bar i,.prog-row.reversed .bar i{background:var(--bad)}
.prog-row.busy .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 1.2s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prog-row .st{font-size:12px;color:var(--muted);text-align:right}
.prog-row.done .st{color:var(--ok)} .prog-row.failed .st,.prog-row.reversed .st{color:var(--bad)}
.tick{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.bulk{display:flex;gap:8px;align-items:center}
.bulk.off{visibility:hidden}
.bulk #bulkN{display:inline-block;min-width:92px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bulk button:disabled{opacity:.45;cursor:not-allowed}
.fxh{display:block;font-size:11px;color:var(--muted);line-height:1.2}
dialog{border:0;border-radius:8px;padding:0;background:var(--panel);color:var(--text);width:min(720px,94vw);max-height:90vh;box-shadow:0 4px 8px 3px #0000002a,0 1px 3px #0000004d}
dialog::backdrop{background:#20212466}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:18px;font-weight:400}
.dlg-b{padding:4px 20px 14px;overflow:auto;max-height:calc(90vh - 120px)}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin-bottom:10px}
.row label{color:var(--muted)}
.lines .ln{display:grid;grid-template-columns:1fr 46px 76px 24px;gap:6px;align-items:center;margin-bottom:4px}
.cnt{font-size:12px;color:var(--muted);text-align:right}
.cnt.over{color:var(--bad);font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}
.toast{position:fixed;bottom:44px;left:24px;background:#323232;color:#fff;padding:12px 18px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:60vw;box-shadow:0 3px 5px #0003}
.toast.on{opacity:1}
pre.out{white-space:pre-wrap;background:var(--head);padding:10px;border-radius:4px;font-size:12px;max-height:50vh;overflow:auto}
/* status bar at the bottom, like Editor's */
footer{display:flex;align-items:center;gap:14px;padding:5px 16px;border-top:1px solid var(--line);background:var(--head);font-size:12px;color:var(--muted)}
.hdot{width:10px;height:10px;border-radius:50%;background:#9aa0a6;flex:none}
.hdot.green{background:var(--ok)}.hdot.amber{background:#f9ab00}.hdot.red{background:var(--bad)}
.hl-row{display:grid;grid-template-columns:14px 150px 1fr;gap:10px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line2)}
.hl-row .hdot{margin-top:5px}
.hl-row b{text-transform:capitalize}
/* status pill + menu */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;line-height:18px}
.pill i{width:8px;height:8px;border-radius:50%;background:#9aa0a6;flex:none}
.pill.Active i,.pill.Enabled i{background:var(--ok)}.pill.Removed i{background:var(--bad)}
.pill.Removed{color:var(--bad)}
td.st-edit{cursor:pointer}
td.st-edit .pill:after{content:"▾";font-size:9px;color:var(--muted);margin-left:2px}
td.st-edit:hover .pill{border-color:var(--accent)}
.menu{position:fixed;z-index:50;background:var(--panel);border-radius:6px;box-shadow:0 2px 6px 2px #00000026,0 1px 2px #0000004d;padding:6px 0;min-width:170px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-radius:0;background:none;text-align:left;padding:8px 16px;font-weight:400;color:var(--text)}
.menu button:hover{background:var(--hover)}
.menu .sep{border-top:1px solid var(--line);margin:6px 0}
.menu .cur{font-weight:500}
.dmenu{position:fixed;z-index:60;background:var(--panel);border-radius:6px;box-shadow:0 2px 6px 2px #00000026,0 1px 2px #0000004d;padding:6px 0;width:340px;max-height:80vh;overflow:auto}
.dmenu .dh{padding:6px 16px 8px;font-size:12px;color:var(--muted)}
.dmenu button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-radius:0;background:none;text-align:left;padding:7px 16px;font-weight:400;color:var(--text)}
.dmenu button:hover:not(:disabled){background:var(--hover)}
.dmenu button:disabled{color:var(--muted);cursor:default}
.dmenu button.sub{padding-left:34px;font-size:13px}
.dmenu button.top{font-weight:500}
.dmenu .when{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.dmenu .sep{border-top:1px solid var(--line);margin:6px 0}
.dmenu .dwarn{margin:4px 12px;padding:6px 8px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:12px}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#dataWarn{width:8px;height:8px;border-radius:50%;background:#f9ab00;display:none}
#hlAge{font-size:11px;color:var(--muted);font-weight:400}
/* filter pills */
.fpills{display:flex;gap:6px;flex-wrap:wrap}
.fpills button{padding:3px 12px;border-radius:16px;font-weight:400;font-size:13px}
.fpills button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:500}
.fpills .n{color:var(--muted);margin-left:4px;font-size:12px}
/* thumbnails + hover preview */
img.thumb{width:40px;height:40px;object-fit:cover;border-radius:4px;display:block;background:var(--line2);cursor:zoom-in}
td.thumbc{padding:2px 6px;width:52px}
.hoverprev{position:fixed;z-index:60;pointer-events:none;background:var(--panel);border-radius:8px;padding:6px;box-shadow:0 4px 12px #0000004d;display:none}
.hoverprev img{width:400px;max-height:420px;object-fit:contain;display:block;border-radius:4px}
tr.focus td{background:var(--accent-bg)!important}
#grid tr[data-i]{scroll-margin-top:44px;scroll-margin-bottom:8px}
/* right panel: Edit | Draft */
.rtabs{display:flex;border-bottom:1px solid var(--line)}
.rtabs button{flex:1;border:0;border-radius:0;background:none;padding:12px 0;border-bottom:3px solid transparent;color:var(--muted)}
.rtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none;flex-direction:column;min-height:0;flex:1}
.pane.on{display:flex}
.edit-body{overflow:auto;flex:1;padding:12px 14px}
.edit-body .fld{margin-bottom:12px}
.edit-body .fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.edit-body .fld input,.edit-body .fld select,.edit-body .fld textarea{width:100%}
.edit-body .fld.chg input,.edit-body .fld.chg textarea,.edit-body .fld.chg select{background:var(--draft-bg)}
.edit-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.edit-head img{width:96px;height:96px;object-fit:cover;border-radius:6px;cursor:zoom-in;flex:none;background:var(--line2)}
.edit-head .t{font-weight:500;word-break:break-word}
.edit-head .s{font-size:12px;color:var(--muted);margin-top:2px}
.prevbox{border:1px solid var(--line);border-radius:6px;margin:4px 0 14px;overflow:hidden;background:var(--head)}
.prevbox .bar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
.prevbox .frame{display:flex;flex-wrap:wrap;justify-content:center;max-height:560px;overflow:auto;background:#fff}
.prevbox iframe{border:0;transform-origin:top center}
.edit-foot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.edit-foot button{flex:1}
.edit-foot .asstate{flex:2;align-self:center;font-size:12px;color:var(--muted)} .asstate.ok{color:var(--ok,#188038)} .asstate.bad{color:var(--bad,#c5221f)}
/* columns dialog */
.colpick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.colpick .list{border:1px solid var(--line);border-radius:6px;max-height:52vh;overflow:auto}
.colpick label.c{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2)}
.colpick .sel .r{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--line2)}
.colpick .sel .r span{flex:1}
.colpick .sel .r button{padding:0 7px}
.cardbox{border:1px solid var(--line);border-radius:6px;padding:8px 10px 2px;margin-bottom:12px}
.cardh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cardh img{width:40px;height:40px;object-fit:cover;border-radius:4px;cursor:zoom-in}
.edit-body .fld input[type=checkbox],.edit-body .fld input[type=radio],dialog input[type=checkbox],dialog input[type=radio]{width:16px;height:16px;flex:none;padding:0}
.plat .pos{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 0 6px 24px;font-size:13px}
.plat .pos label{display:inline-flex;gap:5px;align-items:center}
.localprev{padding:10px;width:100%;color:#202124;font-size:13px}
.localprev img,.localprev video{width:100%;max-height:340px;object-fit:contain;background:#f1f3f4;border-radius:4px;display:block;margin-bottom:8px}
.localprev .pt{white-space:pre-wrap;margin-bottom:6px}
.localprev .hl{font-weight:500}
.set-sec{margin-bottom:22px}
.set-sec h3{font-size:15px;font-weight:500;margin:0 0 8px}
.set-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.set-row .grow{flex:1;min-width:0}
.set-row .sub{font-size:12px;color:var(--muted)}
@media (max-width:1100px){main{grid-template-columns:240px 1fr}aside.draft{display:none}.legend{display:none}}
</style>
</head>
<body>
<div class="app">
<header>

  <button id="setupBtn" class="tb" title="Keys and Sign in with Google" onclick="openSetup()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.65 10A6 6 0 1 0 7 18a6 6 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>Setup</button>
  <button id="setBtn" class="tb" title="Accounts and saved views"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>Settings</button>
</header>
<div class="subbar">
  <select id="acct" title="Ad account: switch between your Google Ads and Meta accounts"></select>

  <span id="pend" class="chip"></span>

<main>
  <aside class="tree">
    <div class="pad search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="treeSearch" placeholder="Search campaigns"></div>

      <button class="tab" id="creativesLink" title="Creative and asset performance for this account: headlines, descriptions, images and videos across ads">Creatives (this account)</button></div>

  <section>

      <select id="rangeSel" title="Date range for the stats columns"><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="custom">Custom range ...</option></select>

        <button data-bulk="enabled" disabled>Enable</button><button data-bulk="paused" disabled>Pause</button><button data-bulk="removed" class="danger" disabled>Remove</button></span>
      <button id="addBtn" class="primary">+ Add</button>
      <button id="sideOpen" title="Open the Edit and Draft panel">Edit · Draft <span id="draftN2"></span></button>

    <div id="paneEdit" class="pane"><div id="editBody" class="edit-body"><div class="empty">Click a row to see and edit it here.</div></div><div id="editFoot" class="edit-foot" style="display:none"></div></div>

</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = {acct: localGet("acct") || "ml", kind: localGet("kind") || "campaigns", camp: null, ag: null, rows: [], sort: null,
           sel: new Set(), open: new Set(), draftV: -1, tree: [], filter: localGet("filter") || "all", focus: null, views: [], accts: []};
function localGet(k){ try { return localStorage.getItem("adsstudio." + k) } catch(e) { return null } }
function localSet(k, v){ try { localStorage.setItem("adsstudio." + k, v) } catch(e) {} }
// Per-process secret the server puts in <meta name="studio-press">; every POST sends it (see server.py guard).
const PRESS = (document.querySelector('meta[name="studio-press"]') || {}).content || "";
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json", "X-Studio-Press":PRESS}, body: JSON.stringify({acct:S.acct, ...body})} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 3200) }
const qs = o => Object.entries(o).filter(([,v]) => v !== null && v !== undefined && v !== "").map(([k,v]) => k + "=" + encodeURIComponent(v)).join("&");

// ---- views: columns per entity type, Editor's names ----
const money = v => v == null ? "" : Number(v).toFixed(2);
// ---- display currency (Settings, saved server-side). DISPLAY ONLY: what is typed, stored in a draft or pushed to
// Google/Meta is always the account's own currency (native values from the server, never converted here). ----
S.disp = "own"; S.fx = null;
const SYM = {GBP:"£", USD:"$", EUR:"€"};
const acctCur = (key = S.acct) => ((S.accts || []).find(a => a.key === key) || {}).currency || "";
function fxRate(from, to){ if (!S.fx || !from || !to) return null; if (from === to) return 1; const r = S.fx.rates || {}; return r[from] && r[to] ? r[to] / r[from] : null }
const dispCur = () => S.disp !== "own" && fxRate(acctCur(), S.disp) != null ? S.disp : null; // null: show native, as before
const curFmt = (v, cur) => { if (v == null || v === "") return ""; const n = Number(v).toLocaleString("en-GB", {minimumFractionDigits:2, maximumFractionDigits:2}); return SYM[cur] ? SYM[cur] + n : n + " " + cur };
const toDisp = (v, from = acctCur()) => v == null || v === "" || !dispCur() ? null : Number(v) * fxRate(from, S.disp);
const fxWhen = () => S.fx ? `${S.fx.source}, ${fxDate(S.fx.date)}${S.fx.stale ? " (rate may be out of date)" : ""}` : "";
const fxDate = iso => { if (!iso) return "unknown date"; const d = new Date(iso + "T12:00:00"); return d.getDate() + " " + d.toLocaleString("en-GB", {month:"long"}) + " " + d.getFullYear() };
const isMoney = c => c.fmt === money;
const colLabel = c => { const dc = dispCur(); return dc && isMoney(c) ? `${c.label} (${c.edit === "money" ? acctCur() : dc})` : c.label };
// one money cell: [html, title]. Editable money stays native with a "≈" hint; read-only money is converted with the native amount in the title.
function moneyCell(c, v){
  const dc = dispCur(), cur = acctCur();
  if (!dc || v == null || v === "") return [money(v), String(v ?? "")];
  if (c.edit === "money") return [`${money(v)}<span class="fxh">≈ ${esc(curFmt(toDisp(v), dc))}</span>`, `${money(v)} ${cur}: account currency, typed and pushed in ${cur}. ≈ ${curFmt(toDisp(v), dc)} at ${fxWhen()}`];
  return [esc(curFmt(toDisp(v), dc)), `${money(v)} ${cur} (account currency). Converted to ${dc} at today's rate: ${fxWhen()}`];
}
// Edit-panel money input label + a live "≈" hint (the input itself is always the native amount)
const curLabel = label => acctCur() ? `${label} (${acctCur()}, account currency)` : label;
const fxHint = id => dispCur() ? `<div class="hint fxlive" data-fx="${id}" style="margin:3px 0 0"></div>` : "";
function wireFx(){ document.querySelectorAll("[data-fx]").forEach(h => { const i = document.getElementById(h.dataset.fx); if (!i) return;
  const f = () => { h.textContent = i.value === "" ? "" : `≈ ${curFmt(toDisp(i.value), S.disp)} (display only, at ${fxWhen()})` }; i.addEventListener("input", f); f() }) }
async function loadFx(){ try { const f = await api("/api/fx"); S.fx = f; S.disp = f.display_currency || "own" } catch(e) { S.fx = null; S.disp = "own" } }
const ST = {key:"status", label:"Status", fmt:v => v ? `<span class="pill ${esc(v)}"><i></i>${esc(v)}</span>` : ""};
const CA = {key:"campaign", label:"Campaign"}, AG = {key:"ad_group", label:"Ad group"}, LV = {key:"level", label:"Level"};
const ED = {key:"editor", label:"Editor", fmt:v => v ? `<span class="ed ${v==="draft"?"draft":""}">${esc(v)}</span>` : ""};
const VIEWS = {
  campaigns:{label:"Campaigns", cols:[{...ST, edit:"status3"}, CA, {key:"type",label:"Type"}, {key:"budget",label:"Budget/day",num:1,fmt:money,edit:"money"},
    {key:"shared_budget",label:"Shared budget"}, {key:"bidding",label:"Bid strategy"}, {key:"max_cpc_cap",label:"Max CPC cap",num:1,fmt:money},
    {key:"target_cpa",label:"Target CPA",num:1,fmt:money}, {key:"ad_groups",label:"Ad groups",num:1}, {key:"keywords",label:"Keywords",num:1},
    {key:"start",label:"Start"}, {key:"end",label:"End"}, ED]},
  ad_groups:{label:"Ad groups", cols:[{...ST, edit:"status"}, CA, AG, {key:"max_cpc",label:"Default max CPC",num:1,fmt:money,edit:"money"},
    {key:"keywords",label:"Keywords",num:1}, {key:"ads",label:"Ads",num:1}, ED], bulk:1},
  keywords:{label:"Keywords", cols:[{...ST, edit:"status"}, CA, AG, {key:"keyword",label:"Keyword"}, {key:"match",label:"Match"},
    {key:"max_cpc",label:"Max CPC",num:1,fmt:money,edit:"money"}, {key:"quality_score",label:"QS",num:1}, {key:"first_page_cpc",label:"First page CPC",num:1,fmt:money},
    {key:"top_of_page_cpc",label:"Top of page CPC",num:1,fmt:money}, {key:"final_url",label:"Final URL"}, ED], bulk:1},
  negatives:{label:"Negative keywords", cols:[LV, CA, AG, {key:"list",label:"Shared list"}, {key:"keyword",label:"Negative keyword"}, {key:"match",label:"Match"}, ST, ED], bulk:1},
  ads:{label:"Ads", cols:[{...ST, edit:"status", when:r => r.ad_type === "Responsive search ad"}, CA, AG, {key:"ad_type",label:"Type"},
    {key:"headline",label:"Headline 1"}, {key:"path1",label:"Path 1"}, {key:"path2",label:"Path 2"}, {key:"final_url",label:"Final URL"},
    {key:"ad_strength",label:"Ad strength"}, {key:"approval",label:"Approval"}, ED], bulk:1, open:r => r.ad_type === "Responsive search ad" && rsaDialog(r)},
  asset_groups:{label:"Asset groups", cols:[ST, CA, {key:"asset_group",label:"Asset group"}, {key:"headlines",label:"Headlines",num:1},
    {key:"long_headlines",label:"Long headlines",num:1}, {key:"descriptions",label:"Descriptions",num:1}, {key:"final_url",label:"Final URL"}, {key:"ad_strength",label:"Ad strength"}, ED]},
  sitelinks:{label:"Sitelinks", cols:[LV, CA, AG, ST, {key:"text",label:"Link text"}, {key:"line1",label:"Description 1"}, {key:"line2",label:"Description 2"},
    {key:"final_url",label:"Final URL"}, {key:"start",label:"Start"}, {key:"end",label:"End"}, ED], open:r => r.level !== "Ad group" && sitelinkDialog(r)},
  callouts:{label:"Callouts", cols:[LV, CA, AG, ST, {key:"text",label:"Callout text"}, {key:"start",label:"Start"}, {key:"end",label:"End"}, ED]},
  snippets:{label:"Snippets", cols:[LV, CA, AG, ST, {key:"header",label:"Header"}, {key:"values",label:"Values"}, ED]},
  prices:{label:"Prices", cols:[LV, CA, AG, ST, {key:"price_type",label:"Type"}, {key:"qualifier",label:"Qualifier"}, {key:"items",label:"Items"}, ED]},
  promotions:{label:"Promotions", cols:[LV, CA, ST, {key:"occasion",label:"Occasion"}, {key:"target",label:"Item"}, {key:"discount",label:"Discount"}, {key:"final_url",label:"Final URL"}, ED]},
  locations:{label:"Locations", cols:[CA, AG, {key:"targeting",label:"Targeting"}, {key:"location",label:"Location"}, {key:"country",label:"Country"},
    {key:"location_id",label:"ID",num:1}, {key:"bid_modifier",label:"Bid adj.",num:1}, ED]},
  audiences:{label:"Audiences", cols:[LV, CA, AG, ST, {key:"audience",label:"Audience"}, {key:"bid_modifier",label:"Bid adj.",num:1}, ED]},
  shared_lists:{label:"Shared negative lists", cols:[{key:"list",label:"List"}, {key:"keywords",label:"Keywords",num:1}, {key:"campaigns",label:"Campaigns",num:1}, {key:"attached_to",label:"Used by"}]},
};

const MONEY_TOOL = "Account currency";
const GSTATS = [{key:"cost",label:"Cost",num:1,fmt:money}, {key:"impressions",label:"Impr.",num:1,hide:1}, {key:"clicks",label:"Clicks",num:1},
  {key:"ctr",label:"CTR %",num:1,hide:1}, {key:"cpc",label:"Avg. CPC",num:1,fmt:money,hide:1}, {key:"conversions",label:"Conv.",num:1},
  {key:"conv_value",label:"Conv. value",num:1,fmt:money,hide:1}, {key:"cost_per_conv",label:"Cost / conv.",num:1,fmt:money,hide:1},
  {key:"select_cabin",label:"Select Cabin",num:1}, {key:"cost_per_select_cabin",label:"Cost / Select Cabin",num:1,fmt:money,hide:1}];
for (const [k, v] of Object.entries(VIEWS)) if (!["negatives", "shared_lists"].includes(k)){ const i = v.cols.findIndex(c => c.key === "editor"); v.cols.splice(i < 0 ? v.cols.length : i, 0, ...GSTATS) }
Object.assign(VIEWS, {
  asset_group_assets:{label:"PMax assets", cols:[{...ST}, CA, {key:"asset_group",label:"Asset group"}, {key:"field",label:"Field"}, {key:"text",label:"Text / asset"},
    {key:"asset_type",label:"Type",hide:1}, {key:"source",label:"Source",hide:1}, {key:"primary_status",label:"Primary status"}, {key:"approval",label:"Approval"}, ...GSTATS], bulk:1, api:1},
  user_lists:{label:"Audience lists", cols:[], ro:1, custom:"Audiences", api:1}, // [audiences] static/audiences.js draws this tab
  recommendations:{label:"Recommendations", cols:[{key:"type",label:"Recommendation"}, LV, CA, AG, {key:"impact_clicks",label:"+ Clicks",num:1}, {key:"impact_cost",label:"+ Cost",num:1,fmt:money},
    {key:"impact_conversions",label:"+ Conv.",num:1}, {key:"dismissed",label:"Dismissed",hide:1}], api:1},
  videos:{label:"Videos", cols:[], ro:1, custom:1, api:1}, // [videos] static/videos.js: YouTube videos, uploads, Demand Gen
});
// Meta stats for the picked date range (meta.grid puts them on these generic keys)
const STATS = [{key:"spend",label:"Spend",num:1,fmt:money}, {key:"impressions",label:"Impr.",num:1}, {key:"reach",label:"Reach",num:1,hide:1},
  {key:"frequency",label:"Frequency",num:1,hide:1}, {key:"clicks",label:"Clicks",num:1}, {key:"ctr",label:"CTR %",num:1},
  {key:"cpc",label:"CPC",num:1,fmt:money,hide:1}, {key:"cpm",label:"CPM",num:1,fmt:money,hide:1}, {key:"results",label:"Results",num:1},
  {key:"cost_per_result",label:"Cost per result",num:1,fmt:money,hide:1},
  {key:"select_cabin",label:"Select Cabin",num:1}, {key:"cost_per_select_cabin",label:"Cost / Select Cabin",num:1,fmt:money},
  {key:"purchases",label:"Purchases",num:1,hide:1}, {key:"cost_per_purchase",label:"Cost / purchase",num:1,fmt:money,hide:1},
  {key:"leads",label:"Leads",num:1,hide:1}, {key:"cost_per_lead",label:"Cost / lead",num:1,fmt:money,hide:1}];
// saved layouts and views from before the range picker used the *_7d keys
const OLD_KEYS = {spend_7d:"spend", impr_7d:"impressions", reach_7d:"reach", frequency_7d:"frequency", clicks_7d:"clicks", ctr_7d:"ctr",
  cpc_7d:"cpc", cpm_7d:"cpm", results_7d:"results", cost_per_result_7d:"cost_per_result"};
const newKey = k => OLD_KEYS[k] || k;
const IDC = {key:"id", label:"ID", hide:1}, UPD = {key:"updated", label:"Updated", hide:1};
const THUMB = {key:"thumbnail", label:"", thumb:1};
const DL = {key:"delivery", label:"Delivery"}, AS = {key:"ad_set", label:"Ad set"};
const MST = {...ST, edit:"mstatus"};

{

  if (!(e.key in keys) || e.altKey || e.ctrlKey || e.metaKey) return;
  if ($("#dlg").open || document.body.classList.contains("area") || document.body.classList.contains("ov")) return;
  const t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  const trs = [...document.querySelectorAll("#grid tr[data-i]")]; if (!trs.length) return;

  const i = cur < 0 ? (keys[e.key] > 0 ? 0 : trs.length - 1) : Math.max(0, Math.min(trs.length - 1, cur + keys[e.key]));

function startEdit(td){
  const r = S.rows[+td.closest("tr").dataset.i], col = V()[S.kind].cols.find(c => c.key === td.dataset.k);
  const cur = cellVal(r, col);
  if (col.edit.startsWith("status") || col.edit === "mstatus"){
    const opts = col.edit === "mstatus" ? ["Active", "Paused"] : col.edit === "status3" ? ["Enabled", "Paused"] : ["Enabled", "Paused", "Removed"];
    td.innerHTML = `<select>${opts.map(o => `<option ${o === cur ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  } else td.innerHTML = `<input type="number" step="0.01" min="0" value="${cur ?? ""}" title="${esc(acctCur() ? acctCur() + ", account currency: typed, saved and pushed as is" : "Account currency")}" placeholder="${esc(acctCur())}">`;
  const inp = td.firstChild; inp.focus();
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    const nv = inp.value;
    if (!save || nv === "" || String(nv) === String(cur)) return renderGrid();
    try { await addChanges([changeFor(r, col.key, nv)], "") } catch(err) { toast(err.message); renderGrid() }
  };
  inp.onkeydown = e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false) };
  inp.onblur = () => finish(true);
  if (inp.tagName === "SELECT") inp.onchange = () => finish(true);
}
const MLEVEL = {campaigns:"campaign", adsets:"adset", ads:"ad"};
function changeFor(r, key, value, kind = S.kind){
  if (isMeta()){
    const level = MLEVEL[kind];
    if (key === "status") return {type:"meta_status", level, id:r.id, status:String(value).toLowerCase().replace("enabled", "active")};
    return {type:"meta_budget", level, id:r.id, budget:Number(value)};
  }
  const status = key === "status" ? String(value).toLowerCase() : undefined;
  const num = key !== "status" ? Number(value) : undefined;
  if (kind === "campaigns") return {type:"campaign", campaign:r.campaign, ...(status ? {status} : {budget:num})};
  if (kind === "ad_groups") return {type:"ad_group", campaign:r.campaign, ad_group:r.ad_group, ...(status ? {status} : {max_cpc:num})};
  if (kind === "keywords") return {type:"keyword", edit:true, campaign:r.campaign, ad_group:r.ad_group, match:r.match.toLowerCase(), keywords:[r.keyword], ...(status ? {status} : {max_cpc:num})};
  if (kind === "ads") return {type:"rsa", edit:true, campaign:r.campaign, ad_group:r.ad_group, local_id:r.id, ...(r.ad_id ? {ad_id:r.ad_id} : {}), status};
  if (kind === "negatives") return {type:"negative", remove:true, campaign:r.campaign, ...(r.ad_group ? {ad_group:r.ad_group} : {}), match:r.match.toLowerCase(), keywords:[r.keyword]};
}

// ---- push live: straight to the Google Ads API, after Google has checked it (validateOnly) ----
const LIVE = {enable_new:false};
const histLink = () => ["Push history", liveHistory, "link"];
// Editor-style tally of the draft: "Ad sets edited 2", "Keywords added 14" ...
const ENT = {campaign:["Campaign", "Campaigns"], adset:["Ad set", "Ad sets"], ad_group:["Ad group", "Ad groups"], ad:["Ad", "Ads"], keyword:["Keyword", "Keywords"],
  negative:["Negative keyword", "Negative keywords"], callout:["Callout", "Callouts"], sitelink:["Sitelink", "Sitelinks"], excluded_location:["Excluded location", "Excluded locations"],
  pmax_asset:["Asset group asset", "Asset group assets"], audience:["Audience", "Audiences"], shared_list:["Shared list", "Shared lists"]};
function pushCounts(items){
  const out = {};
  for (const it of items){
    const c = it.change || {}, t = c.type || "";
    let ent, verb, n = 1;
    if (t.startsWith("meta_")){
      ent = t === "meta_new_ad" ? "ad" : t === "meta_new_campaign" ? "campaign" : t === "meta_new_adset" ? "adset" : (c.level || "ad");
      verb = /^meta_new_/.test(t) ? "added" : "edited";
    } else {
      ent = t === "rsa" ? "ad" : t;
      n = (c.keywords || c.texts || c.locations || c.lists || [1]).length || 1;
      verb = c.remove || c.status === "removed" ? "removed" : c.new || (!c.edit && ["keyword", "negative", "callout", "sitelink", "excluded_location", "pmax_asset", "audience", "shared_list"].includes(t)) || (t === "rsa" && !c.edit) ? "added" : "edited";
    }
    const [one, many] = ENT[ent] || [ent.replace(/_/g, " "), ent.replace(/_/g, " ") + "s"];
    const k = one + "|" + verb; out[k] = out[k] || {one, many, verb, n:0}; out[k].n += n;
  }
  return Object.values(out).sort((a, b) => b.n - a.n).map(x => [`${x.n === 1 ? x.one : x.many} ${x.verb}`, x.n]);
}

// ---- progress list while a push or undo runs (like Editor's Post window) ----
const PST = {waiting:"Waiting", checking:"Checking", sending:"Sending", done:"Done", failed:"Failed", reversed:"Reversed"};
function progressHTML(p, title){
  const items = p.items || [];
  const pct = x => Math.round(100 * (x.state === "done" ? 1 : (0.3 * x.checked + 0.7 * x.sent) / x.total));
  const n = items.filter(x => x.state === "done").length;
  const head = p.running ? `<span class="spin"></span>${esc(p.message || title)}` : p.ok ? `<span class="done">Done</span> ${esc(p.message || "")}` : `<span class="bad">Stopped</span> ${esc(p.message || "")}`;
  return `<div class="prog-h">${head}</div><p class="hint" style="margin:0 0 6px">${n} of ${items.length} done · ${Math.round(p.elapsed || 0)}s</p>`
    + items.map(x => `<div class="prog-row ${x.state} ${p.running && ["checking", "sending"].includes(x.state) ? "busy" : ""}"><div>${esc(x.summary)}</div>
      <div class="bar"><i style="width:${pct(x)}%"></i></div><div class="st">${PST[x.state] || x.state} ${x.state === "done" ? "" : pct(x) + "%"}</div></div>`).join("");
}
async function withProgress(title, path, body, progUrl){
  showDialog(title, `<div class="prog-h"><span class="spin"></span>Starting ...</div>`, []);
  let stop = false, seen = false;
  const tick = async () => {
    if (stop) return;
    try { const p = await api(progUrl || "/api/live/progress?" + qs({acct:S.acct}));
      if (!stop && (p.running || seen)) { seen = true; $("#dlgB").innerHTML = progressHTML(p, title) } else if (!stop && p.running === false && !seen) {}
    } catch(e) {}
    if (!stop) setTimeout(tick, 600);
  };
  setTimeout(tick, 250);
  try { return await api(path, body) } finally { stop = true }
}
async function lastProgress(progUrl){ try { return progressHTML(await api(progUrl || "/api/live/progress?" + qs({acct:S.acct})), "") } catch(e) { return "" } }

      ${r.ok && !isMeta() ? `<p class="hint">Editor doesn't know about this yet: press Get recent changes in Editor so Studio and Editor show the live values.</p>` : ""}`,

async function liveUndo(id, spend){
  if (!spend && !confirm(`Reverse this push in ${isMeta() ? "Meta" : "Google Ads"} now?`)) return;
  try {
    const r = await withProgress("Undoing in " + (isMeta() ? "Meta" : "Google Ads"), "/api/live/undo", {push_id:id, ...(spend ? {accept_spend:true} : {})});
    if (r.needs_spend){ dlg.close(); // switching things back on can raise spend: ask, like the Push live tick
      if (confirm(`This undo can raise spend:\n\n${(r.spend || []).join("\n")}\n\nUndo anyway?`)) return liveUndo(id, true);
      return poll(true) }
    const list = await lastProgress();
    showDialog(r.ok ? "Undone" : "Not undone", `${list}<p>${esc(r.message)}</p>${r.not_undone && r.not_undone.length ? `<p class="hint">Not reversed automatically:</p><ul>${r.not_undone.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}${r.errors ? `<pre class="out">${esc(JSON.stringify(r.errors, null, 1))}</pre>` : ""}`, []);

// ---- live sync: picks up Claude's MCP edits and Editor changes ----
async function poll(force){
  let st; try { st = await api("/api/state?" + qs({acct:S.acct, ...rangeQ()})) } catch(e) { return }
  const g = st.google || {};
  $("#refreshBtn").style.display = isMeta() || g.source === "api" ? "" : "none";
  $("#pend").style.display = isMeta() ? "none" : "";
  if (isMeta()){
    $("#fresh").textContent = st.refreshing ? "Meta: refreshing ..." : "Meta data " + (st.last_download || "").replace("T", " ");
    $("#fresh").className = "chip";
    $("#fresh").title = "Pulled from the Meta API and kept until you refresh (Refresh data, or Push live / Undo for this account)";
    $("#behind").style.display = "none";
    if (S.wasRefreshing && !st.refreshing){ loadTree(); force = true }
    S.wasRefreshing = st.refreshing;
    if (force || st.draft.version !== S.draftV){ S.draftV = st.draft.version; renderDraft(st.draft); loadTree(); if (!document.querySelector("td.edit input, td.edit select")) loadGrid() } // the tree shows draft campaigns / ad sets
    return;
  }
  const p = Object.values(st.editor_pending).reduce((a, b) => a + b, 0);
  $("#pend").textContent = p ? `${p} unposted in Editor` : "Editor: nothing unposted"; $("#pend").className = "chip " + (p ? "warn" : "ok");
  if (S.gsrc !== g.source){ const first = !S.gsrc; S.gsrc = g.source; renderTabs(); if (!first) { loadTree(); force = true } }
  if (g.source === "api"){
    $("#fresh").textContent = g.refreshing ? "Google: refreshing ..." : "Google API data " + String(g.fetched_at || "").replace("T", " ").slice(0, 16);
    $("#fresh").className = "chip"; $("#fresh").title = "Read from the Google Ads API and kept until you refresh (Refresh data, or Push live / Undo for this account). Stats: " + (g.window || "");
    $("#pend").style.display = p ? "" : "none";
    if (S.wasRefreshing && !g.refreshing){ loadTree(); force = true }
    S.wasRefreshing = g.refreshing;
  } else if (st.last_download){
    const age = (Date.now() - new Date(st.last_download)) / 864e5;
    $("#fresh").textContent = "Editor data " + st.last_download.replace("T", " ");
    $("#fresh").className = "chip " + (age >= 2 ? "warn" : "");
    $("#fresh").title = age >= 2 ? "Old data - in Editor: Get recent changes" : "Last download in Editor";
  }
  $("#behind").style.display = g.source !== "api" && st.last_live_push && st.last_download && st.last_live_push.slice(0, 16) > st.last_download ? "" : "none";
  if (force || st.draft.version !== S.draftV){
    const changed = S.draftV !== -1 && st.draft.version !== S.draftV;
    S.draftV = st.draft.version; renderDraft(st.draft);
    if ((changed || force) && !document.querySelector("td.edit input, td.edit select")) loadGrid();
  }
}

function showDialog(title, body, buttons){
  $("#dlgT").textContent = title; $("#dlgB").innerHTML = body;
  $("#dlgF").innerHTML = ""; for (const [label, fn, cls] of buttons){ const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; $("#dlgF").appendChild(b) }
  $("#dlg").showModal();
}

function needScope(level){
  const sc = scopeNames();
  if (isTrial(S.tree.find(c => String(c.id) === S.camp))){ toast(EXP_MSG); return null }
  if (level === "ad_group" && !sc.ad_group){ toast("Pick an ad group in the tree first"); return null }
  if (level === "campaign" && !sc.campaign){ toast("Pick a campaign in the tree first"); return null }
  return sc;
}

// Google Ads counts double-width (East Asian wide / full-width) characters as 2 towards its limits (gae.width)
const gw = s => { let n = 0; for (const ch of String(s || "")){ const c = ch.codePointAt(0); n += (c >= 0x1100 && c <= 0x115F) || (c >= 0x2E80 && c <= 0xA4CF && c !== 0x303F) || (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0xF900 && c <= 0xFAFF) || (c >= 0xFE30 && c <= 0xFE4F) || (c >= 0xFF00 && c <= 0xFF60) || (c >= 0xFFE0 && c <= 0xFFE6) || (c >= 0x1F300 && c <= 0x1F64F) || (c >= 0x20000 && c <= 0x3FFFD) ? 2 : 1 } return n };
function counter(inp, max){ const c = inp.parentElement.querySelector(".cnt"); const f = () => { const n = gw(inp.value); c.textContent = n + "/" + max; c.classList.toggle("over", n > max) }; inp.oninput = f; f() }
function rsaDialog(r, isNew){
  const hl = r.headlines.length ? r.headlines : Array.from({length:3}, () => ({text:"", pin:0}));
  const ds = r.descriptions.length ? r.descriptions : Array.from({length:2}, () => ({text:"", pin:0}));
  const ln = (kind, x, i, max, pins) => `<div class="ln"><input class="${kind}" value="${esc(x.text)}" maxlength="${max + 20}"><span class="cnt"></span>
    <select class="${kind}-pin">${[0, ...Array.from({length:pins}, (_, k) => k + 1)].map(p => `<option value="${p}" ${+x.pin === p ? "selected" : ""}>${p ? "Pin " + p : "-"}</option>`).join("")}</select>
    <button class="link danger" onclick="this.parentElement.remove()">✕</button></div>`;
  showDialog((isNew ? "New responsive search ad" : "Edit ad") + " · " + r.ad_group, `
    ${isNew ? `<p class="hint">New ads are created Paused.</p>` : `<p class="hint">Saving replaces all headlines and descriptions of this ad.</p>`}
    <div class="row"><label>Final URL</label><input id="f_url" value="${esc(r.final_url)}"></div>
    <div class="row"><label>Path 1 / Path 2</label><span><input id="f_p1" value="${esc(r.path1)}" maxlength="15" style="width:45%"> / <input id="f_p2" value="${esc(r.path2)}" maxlength="15" style="width:45%"></span></div>
    <b>Headlines</b> <span class="hint">(3-15, max 30)</span><div class="lines" id="hl">${hl.map((x, i) => ln("h", x, i, 30, 3)).join("")}</div>
    <button class="link" id="addH">+ headline</button><br><br>
    <b>Descriptions</b> <span class="hint">(2-4, max 90)</span><div class="lines" id="ds">${ds.map((x, i) => ln("d", x, i, 90, 2)).join("")}</div>
    <button class="link" id="addD">+ description</button>${noteRow}`,
    [[isNew ? "Add to draft" : "Save to draft", () => {
      const get = (sel, max) => [...document.querySelectorAll(sel + " .ln")].map(l => ({text:l.querySelector("input").value.trim(), pin:+l.querySelector("select").value})).filter(x => x.text);
      const c = {type:"rsa", campaign:r.campaign, ad_group:r.ad_group, final_url:val("f_url"), path1:val("f_p1"), path2:val("f_p2"), headlines:get("#hl"), descriptions:get("#ds")};
      if (!isNew){ Object.assign(c, {edit:true, local_id:r.id}); if (c.final_url === r.final_url) delete c.final_url; delete c.path1; delete c.path2 }
      submit([c], val("f_note"));
    }, "primary"]]);
  const wire = () => { document.querySelectorAll("#hl input.h").forEach(i => counter(i, 30)); document.querySelectorAll("#ds input.d").forEach(i => counter(i, 90)) };
  $("#addH").onclick = () => { if ($("#hl").children.length < 15){ $("#hl").insertAdjacentHTML("beforeend", ln("h", {text:"", pin:0}, 0, 30, 3)); wire() } };
  $("#addD").onclick = () => { if ($("#ds").children.length < 4){ $("#ds").insertAdjacentHTML("beforeend", ln("d", {text:"", pin:0}, 0, 90, 2)); wire() } };
  wire();
}

    <div class="row"><label>Description 1</label><span><input id="f_l1" value="${esc(r.line1)}"> <span class="cnt"></span></span></div>
    <div class="row"><label>Description 2</label><span><input id="f_l2" value="${esc(r.line2)}"> <span class="cnt"></span></span></div>
    <div class="row"><label>Final URL</label><input id="f_url" value="${esc(r.final_url)}"></div>${noteRow}`,
    [[isNew ? "Add to draft" : "Save to draft", () => {
      if (isNew) return submit([{type:"sitelink", campaign:r.campaign, text:val("f_t"), line1:val("f_l1"), line2:val("f_l2"), final_url:val("f_url")}], val("f_note"));
      const c = {type:"sitelink", edit:true, campaign:r.campaign || "(account)", text:r.text, ...(r.level === "Account" ? {level:"account"} : {})};

  counter($("#f_t"), 25); counter($("#f_l1"), 35); counter($("#f_l2"), 35);
}

    <div class="row"><label>Ad name</label><input id="f_name" value="${esc(r.ad)}"></div>

        if (val("f_ds") !== r.description) c.description = val("f_ds");

}
async function loadDataStatus(){

const dkey = (src, acct) => src + "|" + (acct || "");
function dBusy(src, acct){
  if (DS.busy.has("all|") || DS.busy.has(dkey(src, acct))) return true;

// Refresh one source (or one account of it). Area pages call this from their own Refresh buttons with {reload:false}.
async function dataRefresh(source, account, opt){
  opt = opt || {};
  const k = dkey(source, account); if (DS.busy.has(k)) return;
  DS.busy.add(k); drawData();
  const body = {source, account: account || null, ...(opt.body || {})};
  if (["all", "google", "meta"].includes(source)){ const r = S.range.start ? {start:S.range.start, end:S.range.end} : {days:S.range.days || "7"}; Object.assign(body, r) }
  let res = null;
  try {
    res = await api("/api/data/refresh", body);
    const bad = (res.results || []).filter(x => x.error || (x.errors || []).length);
    toast(bad.length ? "Refreshed, with problems: " + bad.map(x => x.error || x.errors.join("; ")).join(" | ").slice(0, 300) : `Fresh data: ${DLABEL[source] || source}${account ? " (" + account + ")" : ""}`);
  } catch(e) { toast(e.message) }
  DS.busy.delete(k);
  await loadDataStatus(); drawData();
  if (opt.reload === false) return res;
  const ads = source === "all" || (source === (isMeta() ? "meta" : "google") && (!account || account === S.acct));
  if (document.body.classList.contains("ov")) overviewPage();
  else if (S.area === "ads" && ads){ await loadTree(); await loadGrid(); poll(true) }
  else if (S.area !== "ads" && (source === "all" || source === S.area) && AREAS[S.area]){ const el = $("#areaPage"); el.innerHTML = ""; try { AREAS[S.area].render(el) } catch(e) {} }
  return res;
}

    : `<input id="${id}" value="${esc(val ?? "")}" ${opt.type ? `type="${opt.type}" step="0.01" min="0"` : ""}>`;
  return `<div class="fld ${chg ? "chg" : ""}"><label><span>${label}${chg ? " · in draft" : ""}</span><span class="cnt" data-for="${id}" data-max="${opt.max || ""}"></span></label>${inner}

    const old = [...new Set([...(AUTO.ids[key] || []), ...draftIdsFor(j.r, j.keys)])].filter(id => have.has(id));
    if (!old.length && !ch.length){ asStatus("No changes", ""); return }

  el.innerHTML = `<div class="set-row"><div class="grow"><div>Data refresh</div><div class="sub">Manual (default): Studio fetches each source once, then only when you press Refresh for it. Automatic: cached data expires on its own and the jobs below that fetch data run on their schedule (Google, Meta and the other platforms are then asked without a click).</div></div>
      <select id="dataPolicy"><option value="manual" ${auto ? "" : "selected"}>Manual</option><option value="auto" ${auto ? "selected" : ""}>Automatic</option></select></div>`
    + (st.jobs.length ? st.jobs.map(j => `<div class="set-row"><div class="grow"><div>${esc(j.label)}</div>
      <div class="sub">${esc(j.schedule)} · last run ${when(j.last_run)}: ${res(j)}${j.enabled ? " · next " + when(j.next_run) : ""}${j.refresh ? (auto ? " · fetches data (Data refresh is automatic)" : " · fetches data, so it waits until Data refresh is automatic") : ""}</div>
      ${j.last_error && j.last_status !== "ok" ? `<div class="sub" style="color:var(--bad)">${esc(j.last_error)}</div>` : ""}${j.note ? `<div class="sub">${esc(j.note)}</div>` : ""}</div>
      ${j.can_disable ? `<label class="sub"><input type="checkbox" data-job="${esc(j.name)}" ${j.enabled ? "checked" : ""}> On</label>` : `<span class="sub">always on</span>`}</div>`).join("")
    : `<p class="hint">No background jobs yet.</p>`)
    + `<p class="hint">${st.running ? "The scheduler is running." : "The scheduler starts with Studio."}${st.error ? " Scheduler error: " + esc(st.error) : ""} Jobs never run twice at once; a failed or slow run is shown here and the job tries again at its next time.</p>`;
}

<!-- [mac-app updater] begin: version in the footer + "Update available" banner (only inside the Mac app, MSTUDIO_APP=1). Self-contained; see updater.py -->
<style>
#msUpd{position:fixed;right:16px;bottom:40px;z-index:9999;display:none;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line,#dadce0);border-radius:8px;background:var(--panel,#fff);color:var(--text,#202124);box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:13px}
#msUpd.on{display:flex}
#msUpd button{font:inherit;cursor:pointer;border:0;border-radius:4px;padding:4px 10px;background:#1a73e8;color:#fff}
#msUpd button.ghost{background:transparent;color:var(--muted,#5f6368)}
#msUpd button:disabled{opacity:.6;cursor:default}
</style>
<div id="msUpd" role="status"><span id="msUpdMsg"></span><button id="msUpdGo">Update now</button><button id="msUpdX" class="ghost" title="Hide until next start">Later</button></div>
<script>
(function(){
  const box = document.getElementById("msUpd"), msg = document.getElementById("msUpdMsg"),
        go = document.getElementById("msUpdGo"), later = document.getElementById("msUpdX");
  const press = (document.querySelector('meta[name="studio-press"]') || {}).content || "";
  const getJ = async u => { try { const r = await fetch(u); return r.ok ? await r.json() : null } catch(e) { return null } };
  let poll = null;
  later.onclick = () => box.classList.remove("on");
  function show(text, canGo){ msg.textContent = text; go.style.display = canGo ? "" : "none"; go.disabled = false; box.classList.add("on") }
  async function check(force){
    const st = await getJ("/api/app/update/check" + (force ? "?force=1" : ""));
    if (!st || !st.available || st.skipped || !st.release) return;
    if (st.canInstall) show("Update available: v" + st.latest + " - ", true);
    else show("Update available: v" + st.latest + " (this copy can't update itself: " + (st.cannotInstall || "unknown") + ")", false);
  }
  go.onclick = async () => {
    go.disabled = true; msg.textContent = "Downloading update...";
    let j = null;
    try { j = await (await fetch("/api/app/update/apply", {method:"POST", headers:{"Content-Type":"application/json", "X-Studio-Press":press}, body:"{}"})).json() } catch(e) {}
    if (!j || !j.ok) { show("Update failed: " + ((j && j.error) || "no answer") + ". Nothing was changed.", false); return }
    poll = setInterval(async () => {
      const st = await getJ("/api/app/update/check"); const job = st && st.job;
      if (!job) return;
      if (job.phase === "downloading") msg.textContent = "Downloading update... " + (job.progress || 0) + "%";
      else if (job.phase === "verifying") msg.textContent = "Checking the download...";
      else if (job.phase === "installing") { msg.textContent = "Installing - Marketing Studio restarts in a moment..."; clearInterval(poll) }
      else if (job.phase === "error") { clearInterval(poll); show("Update failed: " + (job.error || "unknown error") + ". Nothing was changed.", false) }
    }, 700);
  };
  (async () => {
    const v = await getJ("/api/app/version");
    if (!v) return;
    const f = document.querySelector("footer > span");
    if (f && v.version) f.textContent = "Marketing Studio v" + v.version;
    if (!v.app) return;
    setTimeout(() => check(false), 6000);
    setInterval(() => { if (!box.classList.contains("on")) check(false) }, 24 * 3600 * 1000);
  })();
})();
</script>
